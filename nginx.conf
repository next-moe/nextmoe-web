server {
    listen 80;
    server_name nextmoe.com;

    return 301 https://www.nextmoe.com$request_uri;
}

server {
    listen 80 default_server;
    server_name www.nextmoe.com _;

    charset utf-8;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    location /_nuxt/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /images/ {
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location ~* \.(?:ico|png|jpe?g|webp|svg|woff2?)$ {
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600";
    }

    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600";
    }

    location = /site.webmanifest {
        add_header Cache-Control "public, max-age=86400";
    }

    location ^~ /en/ {
        add_header Cache-Control "no-cache";
        error_page 404 /en/404/index.html;
        try_files $uri $uri/index.html $uri/ =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html $uri/ =404;
    }

    error_page 404 /404/index.html;
}
