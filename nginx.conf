# `add_header` in a location block replaces every add_header inherited from the
# server, so a per-location Cache-Control would silently drop the security
# headers below. The cache policy goes through a map instead, leaving exactly one
# add_header scope for the whole server.
map $uri $nextmoe_cache {
    default                                "no-cache";
    ~^/_nuxt/                              "public, max-age=31536000, immutable";
    ~^/images/                             "public, max-age=2592000";
    ~*\.(?:ico|png|jpe?g|webp|svg|woff2?)$ "public, max-age=2592000";
    ~^/robots\.txt$                        "public, max-age=3600";
    ~^/sitemap\.xml$                       "public, max-age=3600";
    ~^/site\.webmanifest$                  "public, max-age=86400";
}

server {
    listen 6761;
    server_name nextmoe.com;

    return 301 https://www.nextmoe.com$request_uri;
}

server {
    listen 6761 default_server;
    server_name www.nextmoe.com _;

    charset utf-8;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/manifest+json
        image/svg+xml;

    add_header Cache-Control $nextmoe_cache always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    location /_nuxt/ {
        access_log off;
        try_files $uri =404;
    }

    location /images/ {
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:ico|png|jpe?g|webp|svg|woff2?)$ {
        access_log off;
        try_files $uri =404;
    }

    location ^~ /en/ {
        error_page 404 /en/404/index.html;
        try_files $uri $uri/index.html $uri/ =404;
    }

    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }

    error_page 404 /404/index.html;
}
