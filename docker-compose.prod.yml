# nextmoe-web — PRODUCTION compose (Dokploy + the GHCR image).
#
# The image is a finished static site inside nginx:alpine: no env, no secrets, no
# backing services, nothing read at runtime. Every domain and URL is baked in at
# build time, so this file has no `environment:` block and never will.
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Point BOTH www.nextmoe.com and nextmoe.com at this app in Dokploy — the apex
# 301 is served by nginx inside the container, so the apex has to reach it.
name: nextmoe-web

services:
  # Dokploy registers the SERVICE NAME on the shared dokploy-network, so a
  # generic name like `web` collides with every other app that has one.
  nextmoe-web:
    image: ghcr.io/next-moe/nextmoe-web:latest
    pull_policy: always
    expose: ['80']
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

networks:
  default:
    name: dokploy-network
    external: true
