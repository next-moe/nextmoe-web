# main-branch pipeline: gate, publish the image to GHCR, then ask Dokploy to pull
# it. Pushes to main do not run CI separately — the gates job below IS the check,
# so nothing red can reach the registry. CI runs on pull requests.
name: build-and-push

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm typecheck

      - run: pnpm gate:i18n

      - run: pnpm gate:icon

      - run: pnpm generate

      - run: pnpm gate:build

  build:
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/kunmoe/nextmoe-web:latest
            ghcr.io/kunmoe/nextmoe-web:${{ github.sha }}
          cache-from: type=gha,scope=nextmoe-web
          cache-to: type=gha,mode=max,scope=nextmoe-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy redeploy
        env:
          WEBHOOK: ${{ secrets.DOKPLOY_WEBHOOK_NEXTMOE_WEB }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DOKPLOY_WEBHOOK_NEXTMOE_WEB not set — image pushed to GHCR, skipping redeploy trigger."
            exit 0
          fi
          curl -fsS -X POST "$WEBHOOK"
