# nextmoe-portal — LOCAL compose, the acceptance check before a push.
#
# vs docker-compose.prod.yml: `build:` not `image:`, and `ports:` not `expose:`.
# The host port is in the 1xxxx range so this coexists with `pnpm dev` on 7877;
# 6761 is the container-internal port nginx.conf listens on.
#
#   docker compose up -d --build          # http://localhost:15020
#
# The healthcheck ships in the Dockerfile (wget against /), so it applies however
# the image is run — no `healthcheck:` block belongs in either compose file.
name: nextmoe-portal

services:
  nextmoe-portal:
    build:
      context: .
      dockerfile: Dockerfile
    image: nextmoe/portal
    ports: ['15020:6761']
    restart: unless-stopped
